<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen &amp; Restaurant Talk</title>
<style>
:root{--bg:#eef2ef;--fg:#16231d;--card:#fff;--mut:#5d6b64;--acc:#b3261e;--ok:#d6f0dc;--okb:#2e8b4f;--bad:#fde1de;--badb:#c0392b;--bd:#cfd9d3;--hl:#fff6d6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--fg:#e8efe9;--card:#18261f;--mut:#9db0a5;--acc:#ff7a6e;--ok:#1d3d29;--okb:#5ac67f;--bad:#43211e;--badb:#ff8a7d;--bd:#2d4338;--hl:#3a3418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a15;--fg:#e8efe9;--card:#18261f;--mut:#9db0a5;--acc:#ff7a6e;--ok:#1d3d29;--okb:#5ac67f;--bad:#43211e;--badb:#ff8a7d;--bd:#2d4338;--hl:#3a3418;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:740px;margin:0 auto;padding:18px 14px 40px}
h1{font:700 2rem/1.15 Georgia,"Times New Roman",serif;margin:8px 0 4px}
h2{font:700 1.35rem/1.2 Georgia,serif;margin:0}
h3{font-size:1.05rem;margin:18px 0 2px}
.sub{color:var(--mut);margin:0 0 18px}
.tk{background:var(--card);border:1px solid var(--bd);border-top:6px solid var(--acc);border-radius:4px 4px 0 0;margin:0 0 26px;padding:14px 16px 18px;position:relative}
.tk::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-9px;height:9px;background:linear-gradient(135deg,var(--card) 50%,transparent 50%) 0 0/12px 9px,linear-gradient(225deg,var(--card) 50%,transparent 50%) 0 0/12px 9px;filter:drop-shadow(0 1px 0 var(--bd))}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tm{display:flex;align-items:center;gap:6px}
.td{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;min-width:3.6em;text-align:right}
.td.end{color:var(--acc)}
button{font:inherit;cursor:pointer;color:var(--fg)}
.tm button,.rs{background:none;border:1px solid var(--bd);border-radius:6px;padding:2px 9px}
.ins{margin:0 0 8px;color:var(--mut)}
.q{padding:8px 0;border-bottom:1px dashed var(--bd)}
.q p{margin:0 0 6px}
.bl{background:var(--hl);padding:0 .6em;border-radius:3px}
.bl.fd{background:var(--ok);font-weight:700;padding:0 .3em}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.o{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px 11px;text-align:left}
.o:hover:not(:disabled){border-color:var(--acc)}
.o.ok{background:var(--ok);border-color:var(--okb);font-weight:600}
.o.bad{background:var(--bad);border-color:var(--badb);text-decoration:line-through}
.o:disabled:not(.ok):not(.bad){opacity:.5}
.o:focus-visible,.tm button:focus-visible,.rs:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sc{margin-top:8px;color:var(--mut);font-size:.92rem}
ol.say{margin:6px 0 0;padding-left:1.5em}
ol.say li{padding:4px 6px;margin-bottom:3px;border-radius:6px;cursor:pointer}
ol.say li.dn{background:var(--ok);text-decoration:line-through;color:var(--mut)}
.sc2{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--hl)}
label{display:block;padding:3px 0}
details{margin-top:16px;border-top:1px dashed var(--bd);padding-top:8px;color:var(--mut)}
summary{cursor:pointer;font-weight:600}
details p{margin:6px 0}
</style></head><body><main>
<h1>Kitchen &amp; Restaurant Talk</h1>
<p class="sub">What do I say at work? Speak a lot, tap to check. Tap a speaking task to tick it off.</p>
<div id="app"></div>
</main>
<script>
const S=[
{t:"Warm-up",m:3,b:[{k:"say",h:"Talk about your work",i:"Answer in 2–3 sentences.",q:["Where do you work?","What do you do first at work?","What is the busiest time of the day?","What is your favorite dish to make?","Is your job easy or difficult? Why?"]}],
n:"Не більше 3 хв, без виправлень — лише налаштувати студентку на англійську. Якщо розговорилась — не зупиняйте."},

{t:"1. Talking in the kitchen",m:8,b:[
{k:"ex",h:"Exercise 1: What do you say?",i:"Choose the best phrase.",q:[
["You carry a hot pan. People are near you.","Hot! Watch out!","Can I have the bill?","I like it."],
["Your boss gives you an order. You understand.","Yes, chef.","No, thank you.","Maybe tomorrow."],
["You need help with a big box.","Can you help me, please?","You help me now.","Do you help?"],
["You need the salt. It is near your colleague.","Could you pass me the salt, please?","Salt is here.","I pass you salt."],
["The dish is not ready. The waiter asks you.","I need two more minutes.","I am ready two minutes.","It is yesterday."],
["There is no chicken in the kitchen.","We’re out of chicken.","We’re in the chicken.","Chicken is no here."],
["You walk fast with plates. A colleague is in front of you.","Excuse me, coming through!","Stay here, please.","Sit down, please."],
["A colleague helps you a lot.","Thanks, that helps a lot!","It’s not my problem.","Of course not."]]},
{k:"ex",h:"Exercise 2: Polite requests",i:"Choose the correct word.",q:[
["___ you close the fridge, please?","Can","Are","Do"],
["Could you ___ me the pan, please?","pass","passing","to pass"],
["Can you ___ the oven, please?","turn on","turning on","turned on"],
["Could you ___ more bread, please?","bring","brings","bringing"],
["___ you help me with this table, please?","Could","Is","Have"],
["Can you wash the dishes, ___?","please","sorry","thanks you"],
["Could you ___ the order again, please?","repeat","repeating","repeats"],
["Can you ___ me the menu, please?","give","giving","gives"]]},
{k:"say",h:"Speaking: Ask politely",i:"Use Can you…? / Could you…? + please. Your teacher is your colleague.",q:["Ask a colleague to help you with a big box.","Ask a colleague to pass you the salt.","Ask a colleague to turn off the oven.","Ask a colleague to wash the dishes.","Ask a colleague to repeat the order.","Ask a colleague to bring more bread to table 4.","Ask a colleague to open the door. Your hands are full.","Ask a colleague to close the fridge."]}],
n:"Вправа 1 — ситуація → фраза: нехай спочатку скаже вголос, потім натисне. Вправа 2 — після can/could йде базова форма дієслова. Speaking: ви колега, вона просить; виправляйте послідовно за схемою «Can/Could you + verb + please?». Якщо бракує часу — speaking у домашнє (голосові повідомлення)."},

{t:"2. Describing food to guests",m:10,b:[
{k:"ex",h:"Exercise 3: Taste and texture",i:"Choose the best word.",q:[
["A lemon is ___.","sour","sweet","spicy"],
["A chilli pepper is ___.","spicy","creamy","fresh"],
["Chips are ___ and hot.","crispy","raw","sour"],
["Ice cream is ___ and cold.","creamy","spicy","sour"],
["Sugar is ___.","sweet","salty","bitter"],
["The soup has too much salt. It is ___.","salty","sweet","fresh"],
["A salad from the garden is ___.","fresh","burnt","spicy"],
["The meat is pink inside and not cooked. It is ___.","raw","creamy","fresh"]]},
{k:"ex",h:"Exercise 4: It comes with… / It contains…",i:"Choose the correct word.",q:[
["The burger ___ with chips.","comes","make","bring"],
["The soup is ___ with tomatoes and basil.","made","doing","taking"],
["The cake ___ nuts.","contains","contain","containing"],
["Is the pasta spicy? – No, it ___ spicy.","isn’t","not","don’t"],
["I’m allergic to fish. – Sorry, this dish ___ fish.","contains","contain","contained"],
["I ___ the chicken salad. It’s very fresh.","recommend","recommends","recommending"],
["The steak ___ with vegetables.","comes","come","coming"],
["Does the soup ___ milk? – Yes, it does.","contain","contains","containing"]]},
{k:"ex",h:"Exercise 5: The guest asks. You answer.",i:"Choose the best answer.",q:[
["“Is the soup spicy?”","No, it’s not spicy.","Yes, I like soup.","It’s very big."],
["“What’s in the salad?”","Tomatoes, cucumber and cheese.","Yes, it is.","Ten minutes."],
["“I’m allergic to nuts. Does it contain nuts?”","No, it doesn’t contain nuts.","Yes, I’m allergic too.","No, I don’t."],
["“What do you recommend?”","I recommend the grilled fish. It’s fresh.","I recommend you are hungry.","Fish is recommend."],
["“Does the burger come with chips?”","Yes, it comes with chips and salad.","Yes, I come with chips.","No, I’m a burger."],
["“Is it vegetarian?”","Yes, it has no meat or fish.","Yes, it has meat.","No, it has no meat."],
["“Is the dessert sweet?”","Yes, it’s very sweet and creamy.","Yes, it’s very sour and salty.","No, it’s a dessert time."],
["“How long is the wait?”","About fifteen minutes.","It’s fifteen minutes ago.","Fifteen people, yes."]]},
{k:"html",h:"Speaking: Our menu",i:"Use: It’s… / It comes with… / It contains… / I recommend…",html:"<div class=sc2><table><tr><th>Dish<th>What is in it<th>Taste<th>Contains<tr><td>Tomato soup<td>tomatoes, basil, cream<td>mild, creamy<td>milk<tr><td>Grilled chicken<td>comes with rice and salad<td>spicy sauce<td>no nuts, no milk<tr><td>Fish and chips<td>fish, potatoes<td>crispy, salty<td>fish, gluten<tr><td>Chocolate cake<td>chocolate, eggs, cream<td>sweet, creamy<td>eggs, milk, nuts</table></div>"},
{k:"say",h:"",i:"",q:["Tell the guest about the tomato soup.","Tell the guest about the grilled chicken.","Tell the guest about the fish and chips.","Tell the guest about the chocolate cake.","A guest has a nut allergy. What can they eat? Tell them.","A guest does not eat fish. What do you recommend?","A guest wants something sweet. Recommend a dish.","A guest wants something hot, but not spicy. Recommend a dish."]}],
n:"Табличка смаків — швидко (більшість слів їй знайома), основний акцент — вправи 4–5 і меню. Ви — гість, питання для рольової гри: Is the soup spicy? What’s in the chicken? I’m allergic to nuts — what can I eat? Does the fish come with chips? Is the cake sweet? What do you recommend? Is the soup vegetarian? Виправляйте структури «It comes with / It contains»."},

{t:"3. Problems and complaints",m:8,b:[
{k:"ex",h:"Exercise 6: What do you say to the guest?",i:"Choose the best answer.",q:[
["“My soup is cold.”","I’m sorry. I’ll bring a hot one.","It’s not my problem.","Cold soup is good."],
["“Where is our food? We’re waiting 40 minutes!”","I’m sorry for the wait. I’ll check with the kitchen.","Please wait. I’m busy.","It’s your problem."],
["“This is not what I ordered.”","I’m very sorry. Let me fix it.","Yes, you ordered it.","No, you are wrong."],
["“I want the fish, please.” (There is no fish.)","I’m sorry, we’re out of fish. Would you like chicken?","No fish. Go.","Fish is no."],
["“The steak is too salty.”","I’m sorry. I’ll tell the chef.","Salt is good for you.","Don’t eat it."],
["“This fork is dirty.”","Of course. Sorry about that. I’ll bring a new one.","No, it’s clean.","Maybe tomorrow."],
["“The food is very slow.”","It will be ready in five minutes.","It was ready yesterday.","It is five minutes before."],
["“Oh no, I spilled my water!”","No problem. I’ll bring a cloth.","It’s your fault.","Don’t drink it."]]},
{k:"ex",h:"Exercise 7: Say sorry and offer help",i:"Choose the correct word.",q:[
["I’m sorry ___ the wait.","for","to","in"],
["I’ll ___ with the chef.","check","checking","checks"],
["We’re ___ of fish today.","out","off","no"],
["It ___ be ready in ten minutes.","will","is","do"],
["Would you ___ chicken instead?","like","likes","liking"],
["Let me ___ it.","fix","fixing","fixed"],
["I’ll ___ you a new plate.","bring","bringing","brought"],
["Sorry ___ that.","about","at","on"]]},
{k:"say",h:"Speaking: Solve the problem",i:"Say: Sorry + I’ll… + Would you like…? Your teacher is the guest.",q:["“My soup is cold.”","“Where is our food? We’re waiting 40 minutes!”","“This is not what I ordered.”","“I want the fish, please.” (There is no fish.)","“The steak is too salty.”","“This fork is dirty.”","“I spilled my coffee!”","“I’m in a hurry. How long is the pasta?”"]}],
n:"Схема відповіді: Sorry + I’ll + пропозиція (Would you like…?). Ви — гість, читайте репліки з картки вголос, додавайте емоцій. Вправа 7 — пастки for/about та will/would like. Якщо часу мало — speaking у домашнє."},

{t:"4. How do you make it?",m:6,b:[
{k:"ex",h:"Exercise 8: What is the step?",i:"Choose the best step.",q:[
["Making tea. What do you do FIRST?","boil the water","drink the tea","add sugar"],
["Making pasta. What do you do FINALLY?","serve the pasta","boil the water","add salt"],
["Making a salad. First, wash the vegetables. What do you do THEN?","cut the vegetables","serve the salad","clean the table"],
["Making pizza. First, make the dough. Then, add sauce and cheese. What do you do AFTER THAT?","bake the pizza","wash the oven","eat the pizza"],
["Making soup. First, cut the onions. Then, fry them. What do you do NEXT?","add water","serve the soup","go home"],
["Making an omelette. What do you do FIRST?","break the eggs","fold the omelette","serve the omelette"],
["Making a burger. What do you do FINALLY?","put it on a plate","cook the meat","buy the bread"],
["Making a cake. What do you do FIRST?","mix the ingredients","decorate the cake","eat the cake"]]},
{k:"say",h:"Speaking: How do you make…?",i:"Use: First, … Then, … Next, … After that, … Finally, … Verbs: peel, chop, boil, fry, bake, mix, add, serve.",q:["How do you make tea or coffee?","How do you make a sandwich?","How do you make scrambled eggs?","How do you make a salad?","How do you make your favorite dish?","How do you make a dish at your work?"]}],
n:"Вправа 8 тренує логіку послідовності та лінкери. У speaking підказуйте дієслова — вони їй знайомі з попередніх уроків. Мета — зв’язне мовлення з 4–5 речень, а не ідеальна граматика."},

{t:"5. Final roleplay",m:5,b:[
{k:"tick",h:"Roleplay A: The guest with an allergy",i:"You are the waiter. Your teacher is the guest. Try to use all the phrases.",q:["Can I help you?","It contains / It doesn’t contain…","I recommend…","It comes with…","I’m sorry for…","I’ll bring…"]},
{k:"tick",h:"Roleplay B: Busy evening in the kitchen",i:"You are the cook. Your teacher is the chef.",q:["Yes, chef.","Could you…, please?","Hot! / Behind you!","I need two more minutes.","We’re out of…","First… Then… Finally…"]}],
n:"Фінальна рольова гра, виправлення — лише наприкінці (delayed correction): записуйте помилки й розберіть 3–4 найважливіші. A: ви — гість з алергією на горіхи, хочете щось солодке; коли принесуть — десерт холодний. B: ви — шеф у години пік: просите поспішати, кажете, що риба закінчилась, питаєте, скільки ще чекати. Що не встигли — у домашнє: голосове «How do you make…?»."}
];
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function ex(b){const w=$("div"),box=$("div"),sc=$("div","sc");w.append($("h3",0,b.h),$("p","ins",b.i),box,sc);let n,s;
function upd(){sc.innerHTML="Done: "+n+"/"+b.q.length+" · First try: <b>"+s+"</b>/"+b.q.length+" ";const r=$("button","rs","↻ Again");r.onclick=draw;sc.append(r)}
function draw(){box.innerHTML="";n=0;s=0;b.q.forEach((it,i)=>{const[q,c,...r]=it,d=$("div","q"),p=$("p",0,(i+1)+". "+q.replace("___","<span class=bl>___</span>")),o=$("div","opts");let bad=0,done=0;
sh([c,...r]).forEach(t=>{const bt=$("button","o");bt.textContent=t;bt.onclick=()=>{if(done)return;if(t===c){done=1;bt.classList.add("ok");[...o.children].forEach(x=>x.disabled=true);if(!bad)s++;n++;const f=p.querySelector(".bl");if(f){f.textContent=c;f.classList.add("fd")}upd()}else{bad=1;bt.classList.add("bad");bt.disabled=true}};o.append(bt)});
d.append(p,o);box.append(d)});upd()}
draw();return w}
function say(b){const w=$("div");if(b.h)w.append($("h3",0,b.h));if(b.i)w.append($("p","ins",b.i));const l=$("ol","say");b.q.forEach(x=>{const li=$("li",0,x);li.onclick=()=>li.classList.toggle("dn");l.append(li)});w.append(l);return w}
function tick(b){const w=$("div");w.append($("h3",0,b.h),$("p","ins",b.i));b.q.forEach(x=>{const l=$("label");const c=document.createElement("input");c.type="checkbox";l.append(c," "+x);w.append(l)});return w}
function timer(m){let t=m*60,id=0;const w=$("div","tm"),d=$("span","td"),g=$("button",0,"▶ Start"),r=$("button",0,"↺");
const show=()=>{d.textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
g.onclick=()=>{if(id){clearInterval(id);id=0;g.textContent="▶ Start"}else{g.textContent="❚❚ Pause";id=setInterval(()=>{t--;show();if(t<=0){clearInterval(id);id=0;g.textContent="▶ Start";d.classList.add("end")}},1000)}};
r.onclick=()=>{clearInterval(id);id=0;t=m*60;g.textContent="▶ Start";d.classList.remove("end");show()};
show();w.append(d,g,r);return w}
const app=document.getElementById("app");
S.forEach(s=>{const sec=$("section","tk"),hd=$("div","hd");hd.append($("h2",0,s.t),timer(s.m));sec.append(hd);
s.b.forEach(b=>sec.append(b.k==="ex"?ex(b):b.k==="say"?say(b):b.k==="tick"?tick(b):(()=>{const w=$("div");w.append($("h3",0,b.h),$("p","ins",b.i),$("div",0,b.html));return w})()));
const d=$("details",0,"<summary>Нотатки для викладача</summary><p>"+s.n+"</p>");sec.append(d);app.append(sec)});
</script></body></html>
